[project]
name = "dmm-light-client"
version = "1.0.0"
description = "Independent Windows DMM client prototype"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "requests[socks]>=2.32,<3", "psutil>=6", "pywin32>=306", "pycryptodome>=3.23,<4"]
[project.gui-scripts]
dmm-light-client = "dmmclient.app:main"
[project.scripts]
dmmcli = "dmmclient.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["dmmclient"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
