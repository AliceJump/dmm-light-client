name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
      - name: Build and verify portable app
        run: uv run python scripts/build.py --no-zip
      - name: Upload verified portable app
        uses: actions/upload-artifact@v4
        with:
          name: DmmLightClient-pr-${{ github.event.pull_request.number || github.run_number }}
          path: dist/DmmLightClient/
          retention-days: 7
